<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Biz</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6aa1ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Dynamic Manifest and Title Script -->
    <!-- NOTE: manifest link is injected here (not declared statically) so the browser
         only fetches the tenant-specific manifest URL, never the static fallback. -->
<script>
  (function() {
    try {
      const tenantId = localStorage.getItem('activeTenantId')
      const v = Date.now()

      // Inject manifest link dynamically so browser fetches the correct URL from the start.
      // If declared statically in HTML before this script, the browser would fetch the
      // generic /manifest.webmanifest before the script can update the href.
      const manifestLink = document.createElement('link')
      manifestLink.rel = 'manifest'
      manifestLink.href = tenantId
        ? `/api/manifest?tenant_id=${tenantId}&v=${v}`
        : '/manifest.webmanifest'
      document.head.appendChild(manifestLink)

      if (tenantId) {
        // Fetch and set dynamic title from tenant data
        fetch(`/.netlify/functions/serve-icon?tenant_id=${tenantId}&type=name`)
          .then(res => res.json())
          .then(data => {
            if (data.app_name) {
              document.title = data.app_name
            }
          })
          .catch(() => {})
      }
    } catch (e) {}
  })()
</script>
    
    <!-- Dynamic Favicon and iOS Icon Script -->
<script>
  (function () {
    try {
      const tenantId = localStorage.getItem('activeTenantId')
      if (!tenantId) return

      const v = Date.now()

      // Favicon
      const iconLink =
        document.querySelector("link[rel*='icon']") || document.createElement('link')
      iconLink.type = 'image/x-icon'
      iconLink.rel = 'shortcut icon'
      iconLink.href = `/.netlify/functions/serve-icon?tenant_id=${tenantId}&type=favicon&v=${v}`
      document.head.appendChild(iconLink)

      // Apple touch icon (iOS Add to Home Screen)
      const appleLink =
        document.querySelector("link[rel='apple-touch-icon']") || document.createElement('link')
      appleLink.rel = 'apple-touch-icon'
      appleLink.href = `/.netlify/functions/serve-icon?tenant_id=${tenantId}&type=192&v=${v}`
      document.head.appendChild(appleLink)

      // Optional 512
      const appleLink512 = document.createElement('link')
      appleLink512.rel = 'apple-touch-icon'
      appleLink512.sizes = '512x512'
      appleLink512.href = `/.netlify/functions/serve-icon?tenant_id=${tenantId}&type=512&v=${v}`
      document.head.appendChild(appleLink512)
    } catch (e) {}
  })()
</script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <form name="contact" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="topic" />
  <input name="email" />
  <textarea name="message"></textarea>
</form>
  </body>
</html>
